<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stat Counter ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #ffe5ec;
    --bg-2: #ffd1dc;
    --ink: #8b3a5a;
    --accent: #ff8fab;
    --soft: rgba(255,255,255,0.7);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Pixelify Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 14px;
  }

  /* ----- THE WIDGET ----- */
  .stat-block {
    width: 100%;
    max-width: 380px;
    aspect-ratio: 5 / 2;
    background: linear-gradient(145deg, var(--bg-1), var(--bg-2));
    color: var(--ink);
    border: 4px solid var(--ink);
    border-radius: 16px;
    box-shadow:
      0 5px 0 var(--ink),
      0 10px 22px rgba(139, 58, 90, 0.15);
    position: relative;
    overflow: hidden;
  }

  /* ----- LIQUID ----- */
  .liquid {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: var(--accent);
    transition: height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1;
    overflow: hidden;
  }
  .wave {
    position: absolute;
    top: -8px;
    left: 0;
    width: 200%;
    height: 14px;
    animation: waveSlide 3s linear infinite;
  }
  @keyframes waveSlide {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .liquid-sparkle {
    position: absolute;
    color: white;
    font-size: 10px;
    opacity: 0;
    pointer-events: none;
    animation: rise linear infinite;
    text-shadow: 0 0 4px rgba(255,255,255,0.8);
  }
  @keyframes rise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 0.9; }
    85% { opacity: 0.9; }
    100% { transform: translateY(-160px); opacity: 0; }
  }

  /* ----- CONTENT ----- */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 12px 14px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }
  .icon {
    font-size: 30px;
    width: 58px;
    height: 58px;
    background: var(--soft);
    border: 3px solid var(--ink);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 0 var(--ink);
    transition: transform 0.2s ease;
    user-select: none;
    cursor: pointer;
    padding: 4px;
  }
  .icon:hover { transform: rotate(-4deg) scale(1.05); }
  .icon svg {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .name {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    line-height: 1.2;
    letter-spacing: 1px;
    color: var(--ink);
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
    text-transform: uppercase;
    word-break: break-word;
  }
  .meta {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    opacity: 0.8;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  }
  .hearts {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
  }
  .heart {
    width: 12px;
    height: 12px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(1px 1px 0 rgba(255,255,255,0.6));
  }
  .heart.pop { animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.7) rotate(-12deg); }
    100% { transform: scale(1); }
  }

  /* ----- BUTTONS ----- */
  .buttons {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  button {
    border: 3px solid var(--ink);
    background: var(--soft);
    color: var(--ink);
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
    box-shadow: 0 3px 0 var(--ink);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #plus {
    background: var(--accent);
    color: white;
  }
  button:hover { transform: translateY(-1px); }
  button:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--ink);
  }

  /* ----- DECO ----- */
  .sparkle-deco {
    position: absolute;
    font-size: 10px;
    color: var(--ink);
    opacity: 0.4;
    pointer-events: none;
    z-index: 2;
  }
  .sparkle-deco.tl { top: 6px; left: 8px; }
  .sparkle-deco.tr { top: 6px; right: 8px; font-size: 12px; }
  .sparkle-deco.bl { bottom: 6px; left: 10px; font-size: 8px; }

  /* ----- FX ----- */
  .float-num {
    position: absolute;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: white;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 2px 2px 0 var(--ink);
    z-index: 5;
    right: 60px;
    top: 50%;
  }
  @keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-40px); opacity: 0; }
  }
  .sparkle-burst {
    position: absolute;
    font-size: 16px;
    pointer-events: none;
    animation: sparkleOut 0.9s ease-out forwards;
    z-index: 5;
  }
  @keyframes sparkleOut {
    0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
    50% { opacity: 1; }
    100% {
      transform:
        translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
        scale(1.4) rotate(180deg);
      opacity: 0;
    }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-1.5deg); }
    75% { transform: rotate(1.5deg); }
  }
  .levelup-wiggle { animation: wiggle 0.45s ease; }

  .levelup-banner {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: white;
    text-shadow:
      2px 2px 0 var(--ink),
      -1px -1px 0 var(--ink),
      1px -1px 0 var(--ink),
      -1px 1px 0 var(--ink);
    z-index: 6;
    pointer-events: none;
    animation: bannerPop 1.2s ease-out forwards;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  @keyframes bannerPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(1); }
    80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -90%) scale(1); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="stat-block" id="block">
    <div class="liquid" id="liquid">
      <svg class="wave" viewBox="0 0 200 14" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,7 Q25,0 50,7 T100,7 T150,7 T200,7 L200,14 L0,14 Z" fill="var(--accent)"/>
      </svg>
      <div id="liquidSparkles"></div>
    </div>

    <span class="sparkle-deco tl">✦</span>
    <span class="sparkle-deco tr">✧</span>
    <span class="sparkle-deco bl">✦</span>

    <div class="content">
      <div class="icon" id="icon">💪</div>
      <div class="info">
        <div class="name" id="name">STRENGTH</div>
        <div class="meta"><span id="level">LV. 1</span> · <span id="xp">0/10</span></div>
        <div class="hearts" id="hearts"></div>
      </div>
      <div class="buttons">
        <button id="minus" aria-label="Subtract">−</button>
        <button id="plus" aria-label="Add">+</button>
      </div>
    </div>
  </div>

<script>
  // ---------- Pixel art icons (# = outline, @ = accent fill, * = highlight) ----------
  const PIXEL_ICONS = {
    strength: [ // dumbbell
      "................",
      "................",
      "................",
      "................",
      "..##........##..",
      ".####......####.",
      ".#*@#......#*@#.",
      ".#@@########@@#.",
      ".#@@########@@#.",
      ".#@@#......#@@#.",
      ".####......####.",
      "..##........##..",
      "................",
      "................",
      "................",
      "................"
    ],
    dexterity: [ // lightning bolt
      "................",
      "................",
      ".........####...",
      "........##@@#...",
      ".......##@@#....",
      "......##@@#.....",
      ".....##@@######.",
      "....##@@@@@@@##.",
      ".....##@@@@@##..",
      "......##@@##....",
      ".....##@@##.....",
      "....##@@##......",
      "...##@@##.......",
      "..##@@##........",
      ".####...........",
      "................"
    ],
    constitution: [ // shield
      "................",
      "...##########...",
      "..#@@@@@@@@@@#..",
      ".#@@@@@@@@@@@@#.",
      ".#@@*@@@@@@*@@#.",
      ".#@@@@@@@@@@@@#.",
      ".#@@@@@@@@@@@@#.",
      ".#@@@@@*@@@@@@#.",
      "..#@@@@@@@@@@#..",
      "...#@@@@@@@@#...",
      "....#@@@@@@#....",
      ".....#@@@@#.....",
      "......#@@#......",
      ".......##.......",
      "................",
      "................"
    ],
    intelligence: [ // book
      "................",
      "................",
      "...##########...",
      "..##@@@@@@@@##..",
      "..#@@@@##@@@@#..",
      "..#@@@@##@@@@#..",
      "..#@@@@##@@@@#..",
      "..#@@@@##@@@@#..",
      "..#@@@@##@@@@#..",
      "..#@@@@##@@@@#..",
      "..#@@@@##@@@@#..",
      "..##@@@@@@@@##..",
      "...##########...",
      "................",
      "................",
      "................"
    ],
    wisdom: [ // eye (all-seeing)
      "................",
      "................",
      "................",
      "....########....",
      "...##@@@@@@##...",
      "..#@@@####@@@#..",
      ".#@@@##**##@@@#.",
      ".#@@@##**##@@@#.",
      "..#@@@####@@@#..",
      "...##@@@@@@##...",
      "....########....",
      "................",
      "................",
      "................",
      "................",
      "................"
    ],
    charisma: [ // sparkly gem
      "................",
      "..*.............",
      "............**..",
      ".......##.......",
      "......####......",
      ".....##@@##.....",
      "....##@@@@##....",
      "...##@@@@@@##...",
      "..##@@@@@@@@##..",
      "...##@@@@@@##...",
      "....##@@@@##....",
      ".....##@@##.....",
      "......####......",
      ".......##.......",
      "..**............",
      ".............*.."
    ]
  };

  function renderPixelIcon(name, theme) {
    const grid = PIXEL_ICONS[name.toLowerCase()];
    if (!grid) return null;
    const rows = grid.length;
    const cols = grid[0].length;
    let rects = '';
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const ch = grid[y][x];
        let color = null;
        if (ch === '#') color = theme.ink;
        else if (ch === '@') color = theme.accent;
        else if (ch === '*') color = '#ffffff';
        if (color) {
          rects += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${color}"/>`;
        }
      }
    }
    return `<svg viewBox="0 0 ${cols} ${rows}" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
  }

  // ---------- Config ----------
  const params = new URLSearchParams(window.location.search);
  const stat = params.get('stat') || 'Strength';
  const perLevel = parseInt(params.get('per')) || 10;

  const presets = {
    strength:     { color: 'rose' },
    dexterity:    { color: 'mint' },
    constitution: { color: 'butter' },
    intelligence: { color: 'sky' },
    wisdom:       { color: 'lavender' },
    charisma:     { color: 'bubblegum' },
  };

  const preset = presets[stat.toLowerCase()] || {};
  const color = params.get('color') || preset.color || 'rose';
  const customIcon = params.get('icon'); // emoji override

  const themes = {
    rose:      { bg1: '#ffe5ec', bg2: '#ffd1dc', ink: '#8b3a5a', accent: '#ff8fab' },
    mint:      { bg1: '#e0f5e9', bg2: '#c5ebd1', ink: '#2d6a4f', accent: '#74c69d' },
    butter:    { bg1: '#fff4d2', bg2: '#ffe8a8', ink: '#9a6a1f', accent: '#f4b942' },
    sky:       { bg1: '#dbeefe', bg2: '#bcdffb', ink: '#2c5282', accent: '#63a4e0' },
    lavender:  { bg1: '#ede2ff', bg2: '#dcc8fc', ink: '#5b3a8e', accent: '#a78bfa' },
    bubblegum: { bg1: '#ffd6eb', bg2: '#ffb3d9', ink: '#a83464', accent: '#ec4899' },
    peach:     { bg1: '#ffe4cc', bg2: '#ffcfa3', ink: '#a04a1f', accent: '#fb923c' },
    sage:      { bg1: '#e8f0e0', bg2: '#cfdfba', ink: '#556b2f', accent: '#9caf88' },
  };
  const theme = themes[color] || themes.rose;
  const root = document.documentElement.style;
  root.setProperty('--bg-1', theme.bg1);
  root.setProperty('--bg-2', theme.bg2);
  root.setProperty('--ink', theme.ink);
  root.setProperty('--accent', theme.accent);

  // Icon: emoji override > pixel art > fallback star
  const iconEl = document.getElementById('icon');
  if (customIcon) {
    iconEl.textContent = customIcon;
  } else {
    const pixelSVG = renderPixelIcon(stat, theme);
    if (pixelSVG) {
      iconEl.innerHTML = pixelSVG;
    } else {
      iconEl.textContent = '⭐';
    }
  }

  document.getElementById('name').textContent = stat.toUpperCase();
  document.querySelector('.wave path').setAttribute('fill', theme.accent);

  // ---------- Hearts ----------
  const heartsEl = document.getElementById('hearts');
  function heartSVG(filled) {
    return `<svg class="heart" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 14s-5-3.5-5-7a3 3 0 0 1 5-2.2A3 3 0 0 1 13 7c0 3.5-5 7-5 7z"
            fill="${filled ? theme.accent : 'transparent'}"
            stroke="${theme.ink}" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>`;
  }
  function buildHearts(count) {
    heartsEl.innerHTML = '';
    const max = Math.min(perLevel, 10);
    for (let i = 0; i < max; i++) {
      const w = document.createElement('div');
      w.innerHTML = heartSVG(i < count);
      heartsEl.appendChild(w.firstElementChild);
    }
  }

  // ---------- Liquid sparkles ----------
  const liquidSparklesEl = document.getElementById('liquidSparkles');
  function buildLiquidSparkles() {
    liquidSparklesEl.innerHTML = '';
    const symbols = ['✦', '✧', '⋆', '·'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('span');
      s.className = 'liquid-sparkle';
      s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      s.style.left = (Math.random() * 92 + 4) + '%';
      s.style.bottom = '-10px';
      s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      s.style.animationDelay = (Math.random() * 4) + 's';
      s.style.fontSize = (7 + Math.random() * 6) + 'px';
      liquidSparklesEl.appendChild(s);
    }
  }
  buildLiquidSparkles();

  // ---------- State ----------
  const key = 'dndstat:' + stat.toLowerCase();
  let points = parseInt(localStorage.getItem(key)) || 0;

  const block = document.getElementById('block');
  const liquidEl = document.getElementById('liquid');
  const levelEl = document.getElementById('level');
  const xpEl = document.getElementById('xp');

  function setLiquidHeight(pct) {
    liquidEl.style.height = pct + '%';
  }

  function render() {
    const level = Math.floor(points / perLevel) + 1;
    const currentXP = points % perLevel;
    levelEl.textContent = 'LV. ' + level;
    xpEl.textContent = currentXP + '/' + perLevel;
    const heartCount = Math.round((currentXP / perLevel) * Math.min(perLevel, 10));
    buildHearts(heartCount);
    setLiquidHeight((currentXP / perLevel) * 100);
  }

  function spawnFloat(text) {
    const el = document.createElement('div');
    el.className = 'float-num';
    el.textContent = text;
    block.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function spawnSparkles() {
    const symbols = ['✦', '✧', '⋆', '✨', '★'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle-burst';
      s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      s.style.color = theme.accent;
      s.style.left = '50%';
      s.style.top = '50%';
      const angle = (i / 12) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 50 + Math.random() * 40;
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      block.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }

  function popLastHeart() {
    const filled = heartsEl.querySelectorAll('.heart path[fill]:not([fill="transparent"])');
    if (filled.length) {
      const last = filled[filled.length - 1].parentElement;
      last.classList.add('pop');
      setTimeout(() => last.classList.remove('pop'), 400);
    }
  }

  function showLevelUpBanner() {
    const b = document.createElement('div');
    b.className = 'levelup-banner';
    b.textContent = 'LEVEL UP!';
    block.appendChild(b);
    setTimeout(() => b.remove(), 1200);
  }

  function addPoints(n) {
    const oldLevel = Math.floor(points / perLevel);
    points = Math.max(0, points + n);
    const newLevel = Math.floor(points / perLevel);
    localStorage.setItem(key, points);

    if (newLevel > oldLevel) {
      setLiquidHeight(100);
      showLevelUpBanner();
      spawnSparkles();
      block.classList.remove('levelup-wiggle');
      void block.offsetWidth;
      block.classList.add('levelup-wiggle');
      setTimeout(() => render(), 800);
    } else if (newLevel < oldLevel) {
      render();
    } else {
      render();
      if (n > 0) {
        spawnFloat('+1');
        popLastHeart();
      } else if (n < 0) {
        spawnFloat('-1');
      }
    }
  }

  document.getElementById('plus').addEventListener('click', () => addPoints(1));
  document.getElementById('minus').addEventListener('click', () => addPoints(-1));

  // Long-press icon to reset
  let resetTimer = null;
  const startReset = () => {
    resetTimer = setTimeout(() => {
      if (confirm('Reset ' + stat + ' to 0?')) {
        points = 0;
        localStorage.setItem(key, 0);
        render();
      }
    }, 1500);
  };
  const cancelReset = () => clearTimeout(resetTimer);
  iconEl.addEventListener('mousedown', startReset);
  iconEl.addEventListener('mouseup', cancelReset);
  iconEl.addEventListener('mouseleave', cancelReset);
  iconEl.addEventListener('touchstart', startReset, { passive: true });
  iconEl.addEventListener('touchend', cancelReset);

  render();
</script>
</body>
</html>
